<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alpha Sud Arena — CRM gamifié</title>
  <meta name="description" content="CRM gamifié d'Alpha Sud Assurance connecté à Pipedrive : pipeline, missions, XP, badges et classement.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo">⚔️</span>
        <div>
          <div class="brand-name">Alpha Sud <span>Arena</span></div>
          <div class="brand-sub" id="mode-badge">Connexion…</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/qg" data-view="qg">🏠 QG</a>
        <a href="#/pipeline" data-view="pipeline">🧭 Pipeline</a>
        <a href="#/agenda" data-view="agenda">📅 Agenda</a>
        <a href="#/portefeuille" data-view="portefeuille">📂 Portefeuille</a>
        <a href="#/trophees" data-view="trophees">🏆 Trophées</a>
      </nav>
      <div class="profile" id="profile-chip"></div>
    </header>
    <main id="view" class="view"><div class="loading">Chargement de l'arène…</div></main>
  </div>
  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
